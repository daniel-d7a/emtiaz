services:
  db:
    image: postgres:16-alpine
    container_name: emtiaz-pg-docker
    restart: unless-stopped
    environment:
      POSTGRES_USER: emtiaz
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emtiaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emtiaz"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Ephemeral Postgres for backend tests (`TEST_DATABASE_URL` on :5434).
  test-db:
    image: postgres:16-alpine
    container_name: emtiaz-pg-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oman_lms_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: emtiaz-redis-docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  rustfs:
    image: rustfs/rustfs:latest
    container_name: emtiaz-rustfs-docker
    restart: unless-stopped
    # S3-compatible object store — local stand-in for Cloudflare R2
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
    volumes:
      - s3data:/data
    ports:
      - "9200:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  rustfs-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: emtiaz-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    command: node dist/scripts/ensure-bucket.js
    environment:
      R2_ENDPOINT: http://rustfs:9000
      R2_REGION: us-east-1
      R2_ACCESS_KEY_ID: rustfsadmin
      R2_SECRET_ACCESS_KEY: rustfsadmin
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-lms-attachments}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: emtiaz-api-docker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://emtiaz:password@db:5432/emtiaz
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      R2_ENDPOINT: http://rustfs:9000
      R2_PRESIGN_ENDPOINT: http://localhost:9200
      R2_REGION: us-east-1
      R2_ACCESS_KEY_ID: rustfsadmin
      R2_SECRET_ACCESS_KEY: rustfsadmin
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-lms-attachments}
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Public URL for the mobile app during dev: `docker compose --profile tunnel up -d tunnel`
  # then read the printed https://<id>.trycloudflare.com from `docker compose logs tunnel`.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: emtiaz-tunnel-docker
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://api:3000
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: emtiaz-web-docker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  s3data:
