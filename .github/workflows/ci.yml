name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5434/oman_lms_test
  TEST_DATABASE_URL: postgresql://postgres:password@localhost:5434/oman_lms_test
  BETTER_AUTH_SECRET: ci-secret-key-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  FRONTEND_URL: http://localhost:5173

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oman_lms_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --legacy-peer-deps
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Install frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: npm run build
      - name: Test frontend
        working-directory: frontend
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
